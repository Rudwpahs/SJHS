<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="hsl(225 34% 4%)" />
  <meta name="description" content="세종과학고 출석면담 대비용 First Principles 과학 Memory Palace" />
  <title>SJHS Science Memory Palace</title>
  <style>
/* ================================================================
   SJHS Memory Palace design tokens
   Primitive -> semantic -> component
   ================================================================ */
:root {
  color-scheme: dark light;

  /* Primitive color */
  --primitive-neutral-0: hsl(0 0% 100%);
  --primitive-neutral-50: hsl(210 24% 98%);
  --primitive-neutral-100: hsl(214 20% 94%);
  --primitive-neutral-200: hsl(215 18% 85%);
  --primitive-neutral-400: hsl(216 12% 58%);
  --primitive-neutral-600: hsl(218 15% 37%);
  --primitive-neutral-750: hsl(220 18% 23%);
  --primitive-neutral-850: hsl(222 24% 14%);
  --primitive-neutral-925: hsl(224 30% 8%);
  --primitive-neutral-975: hsl(225 34% 4%);
  --primitive-blue-300: hsl(205 82% 73%);
  --primitive-blue-500: hsl(207 82% 58%);
  --primitive-cyan-400: hsl(184 64% 56%);
  --primitive-violet-400: hsl(265 64% 68%);
  --primitive-amber-400: hsl(41 92% 63%);
  --primitive-rose-400: hsl(347 77% 70%);
  --primitive-green-400: hsl(151 55% 55%);

  /* Primitive spacing / type / motion */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-pill: 999px;
  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --control-hit-size: 44px;
  --motion-fast: 120ms;
  --motion-standard: 180ms;
  --motion-spatial: 260ms;
}

/* Semantic: preferred dark identity */
:root,
[data-theme="dark"] {
  --surface-map: hsl(225 34% 4%);
  --surface-map-raised: hsl(224 29% 7%);
  --surface-floating: hsl(222 24% 10% / 0.92);
  --surface-floating-strong: hsl(222 24% 9% / 0.98);
  --surface-control: hsl(220 18% 18% / 0.74);
  --surface-control-hover: hsl(218 17% 24% / 0.90);
  --surface-selected: hsl(207 82% 58% / 0.13);
  --surface-muted: hsl(220 18% 17% / 0.62);
  --surface-scrim: hsl(225 34% 2% / 0.52);

  --text-primary: hsl(210 24% 96%);
  --text-secondary: hsl(215 18% 77%);
  --text-muted: hsl(216 13% 66%);
  --text-inverse: hsl(225 34% 4%);

  --border-subtle: hsl(214 23% 76% / 0.14);
  --border-strong: hsl(214 25% 82% / 0.30);
  --focus-ring: hsl(205 90% 70%);
  --shadow-floating: 0 18px 52px hsl(225 45% 2% / 0.30);

  --map-edge: hsl(216 30% 72% / 0.11);
  --map-edge-related: hsl(211 48% 81% / 0.42);
  --map-edge-dim: hsl(217 18% 60% / 0.042);
  --map-label-bg: hsl(224 30% 7% / 0.86);
  --map-label: hsl(210 24% 96% / 0.94);
  --map-label-dim: hsl(214 20% 82% / 0.77);
  --map-selection-ring: hsl(0 0% 100%);
  --map-landmark-core: hsl(210 24% 98%);
  --map-terrain: hsl(211 45% 62% / 0.045);

  --map-community-foundation: hsl(210 24% 96%);
  --map-community-physics: hsl(205 82% 73%);
  --map-community-chemistry: hsl(184 64% 60%);
  --map-community-biology: hsl(151 55% 62%);
  --map-community-earth: hsl(41 84% 66%);
  --map-community-modern: hsl(347 77% 72%);
  --map-community-personal: hsl(265 64% 72%);
  --map-community-math: hsl(28 76% 66%);
}

/* Semantic: complete light alternative */
[data-theme="light"] {
  --surface-map: hsl(210 24% 98%);
  --surface-map-raised: hsl(210 22% 96%);
  --surface-floating: hsl(0 0% 100% / 0.94);
  --surface-floating-strong: hsl(0 0% 100% / 0.99);
  --surface-control: hsl(216 22% 92% / 0.92);
  --surface-control-hover: hsl(215 22% 87% / 0.98);
  --surface-selected: hsl(207 82% 50% / 0.10);
  --surface-muted: hsl(214 20% 92% / 0.86);
  --surface-scrim: hsl(220 30% 12% / 0.18);

  --text-primary: hsl(224 30% 12%);
  --text-secondary: hsl(219 18% 30%);
  --text-muted: hsl(218 13% 38%);
  --text-inverse: hsl(0 0% 100%);

  --border-subtle: hsl(219 20% 32% / 0.14);
  --border-strong: hsl(219 24% 24% / 0.28);
  --focus-ring: hsl(207 92% 38%);
  --shadow-floating: 0 16px 42px hsl(220 24% 20% / 0.13);

  --map-edge: hsl(219 26% 35% / 0.15);
  --map-edge-related: hsl(210 56% 34% / 0.48);
  --map-edge-dim: hsl(219 18% 40% / 0.055);
  --map-label-bg: hsl(0 0% 100% / 0.90);
  --map-label: hsl(224 30% 12% / 0.95);
  --map-label-dim: hsl(219 20% 26% / 0.80);
  --map-selection-ring: hsl(224 30% 12%);
  --map-landmark-core: hsl(224 30% 12%);
  --map-terrain: hsl(207 60% 46% / 0.05);

  --map-community-foundation: hsl(224 20% 20%);
  --map-community-physics: hsl(207 78% 41%);
  --map-community-chemistry: hsl(181 66% 31%);
  --map-community-biology: hsl(151 52% 31%);
  --map-community-earth: hsl(35 75% 38%);
  --map-community-modern: hsl(345 67% 45%);
  --map-community-personal: hsl(264 56% 48%);
  --map-community-math: hsl(24 67% 42%);
}

/* Component tokens */
:root {
  --dock-bg: var(--surface-floating);
  --dock-border: var(--border-subtle);
  --dock-shadow: var(--shadow-floating);
  --control-bg: var(--surface-control);
  --control-bg-hover: var(--surface-control-hover);
  --control-fg: var(--text-secondary);
  --control-fg-active: var(--text-primary);
  --inspector-bg: var(--surface-floating-strong);
  --inspector-border: var(--border-subtle);
  --chip-bg: var(--surface-muted);
}

* { box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
html { background: var(--surface-map); }
body {
  background: var(--surface-map);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; }
button { color: inherit; }
button, input, canvas { -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; opacity: 0.45; }

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 3px;
}

.app-shell { position: relative; isolation: isolate; background: var(--surface-map); }
#map {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  cursor: grab;
  background: var(--surface-map);
  touch-action: none;
}
#map.dragging { cursor: grabbing; }
#map:focus-visible { outline-offset: -4px; }

.map-atmosphere {
  pointer-events: none;
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(circle at 48% 46%, var(--map-terrain), transparent 38%),
    linear-gradient(to bottom, transparent 72%, var(--surface-map) 118%);
}

.command-dock,
.layer-tabs,
.map-controls,
.inspector,
.map-key {
  z-index: 4;
  border: 1px solid var(--dock-border);
  background: var(--dock-bg);
  box-shadow: var(--dock-shadow);
}

.command-dock {
  position: absolute;
  top: max(var(--space-4), env(safe-area-inset-top));
  left: max(var(--space-4), env(safe-area-inset-left));
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: min(720px, calc(100vw - 32px));
  min-height: 56px;
  padding: 6px;
  border-radius: var(--radius-lg);
}
.brand-mark { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 6px; min-width: 190px; }
.brand-symbol {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  color: var(--map-community-foundation);
}
.brand-symbol svg,
.icon-button svg,
.search-icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.brand-copy { display: flex; flex-direction: column; min-width: 0; line-height: 1.05; }
.brand-copy strong { font-size: 13px; letter-spacing: 0.12em; white-space: nowrap; }
.brand-copy small { margin-top: 5px; color: var(--text-muted); font-size: 9px; letter-spacing: 0.12em; white-space: nowrap; }

.search-shell {
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 140px;
  min-height: var(--control-hit-size);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-control);
  color: var(--text-muted);
  transition: border-color var(--motion-fast) ease, background-color var(--motion-fast) ease;
}
.search-shell:focus-within { border-color: var(--focus-ring); background: var(--surface-control-hover); }
.search-icon { display: grid; place-items: center; width: var(--control-hit-size); height: var(--control-hit-size); flex: 0 0 auto; }
.search-shell input {
  width: 100%;
  min-width: 0;
  min-height: 40px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text-primary);
  font-size: var(--text-sm);
}
.search-shell input::placeholder { color: var(--text-muted); }
.dock-actions { display: flex; align-items: center; gap: var(--space-1); }

.icon-button {
  display: inline-grid;
  place-items: center;
  width: var(--control-hit-size);
  height: var(--control-hit-size);
  min-width: var(--control-hit-size);
  min-height: var(--control-hit-size);
  padding: 0;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--control-bg);
  color: var(--control-fg);
  cursor: pointer;
  transition: background-color var(--motion-fast) ease, color var(--motion-fast) ease, opacity var(--motion-fast) ease;
}
.icon-button:hover { background: var(--control-bg-hover); color: var(--control-fg-active); }
.icon-button:active { background: var(--surface-selected); color: var(--text-primary); }

.layer-tabs {
  position: absolute;
  top: calc(max(var(--space-4), env(safe-area-inset-top)) + 68px);
  left: max(var(--space-4), env(safe-area-inset-left));
  display: flex;
  gap: 2px;
  max-width: min(520px, calc(100vw - 32px));
  padding: var(--space-1);
  overflow-x: auto;
  scrollbar-width: none;
  border-radius: var(--radius-md);
}
.layer-tabs::-webkit-scrollbar { display: none; }
.layer-tabs button {
  min-height: var(--control-hit-size);
  padding: 0 var(--space-3);
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text-muted);
  font-size: var(--text-xs);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--motion-fast) ease, color var(--motion-fast) ease;
}
.layer-tabs button:hover { color: var(--text-primary); background: var(--surface-control); }
.layer-tabs button.active,
.layer-tabs button[aria-pressed="true"] { color: var(--text-primary); background: var(--surface-selected); }

.map-controls {
  position: absolute;
  left: max(var(--space-4), env(safe-area-inset-left));
  bottom: max(var(--space-4), env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: var(--control-hit-size) var(--control-hit-size) auto;
  gap: 2px;
  align-items: center;
  padding: var(--space-1);
  border-radius: var(--radius-md);
}
.scale-readout { display: flex; align-items: baseline; gap: var(--space-2); min-width: 112px; padding: 0 var(--space-3); }
.scale-readout span { color: var(--text-muted); font-size: 10px; letter-spacing: 0.12em; }
.scale-readout strong { color: var(--text-primary); font-size: var(--text-xs); }

.inspector {
  position: absolute;
  top: max(var(--space-4), env(safe-area-inset-top));
  right: max(var(--space-4), env(safe-area-inset-right));
  width: min(360px, calc(100vw - 32px));
  max-height: calc(100svh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  padding: var(--space-5);
  overflow: auto;
  border-color: var(--inspector-border);
  border-radius: var(--radius-xl);
  background: var(--inspector-bg);
  overscroll-behavior: contain;
}
.inspector-idle { max-width: 260px; }
.inspector .eyebrow { margin-bottom: var(--space-2); color: var(--text-muted); font-size: 10px; letter-spacing: 0.14em; }
.inspector h1 { margin: 0 0 var(--space-2); color: var(--text-primary); font-size: clamp(22px, 2.1vw, var(--text-xl)); line-height: 1.18; letter-spacing: -0.02em; }
.inspector p { margin: 0; color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.65; }
.shortcut-row { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); margin-top: var(--space-4); color: var(--text-muted); font-size: 11px; }
.shortcut-row span { display: inline-flex; align-items: center; gap: 4px; }
kbd { padding: 2px 5px; border: 1px solid var(--border-subtle); border-radius: 5px; background: var(--surface-control); color: var(--text-secondary); font-family: var(--font-sans); font-size: 10px; }

.inspector .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: var(--space-4) 0; }
.chip { padding: 5px 8px; border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); background: var(--chip-bg); color: var(--text-secondary); font-size: 11px; }
.inspector h2 { margin: var(--space-6) 0 var(--space-2); color: var(--text-muted); font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; }
.mechanism { display: grid; gap: var(--space-2); }
.step { padding: 10px 11px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface-muted); color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.5; }
.path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.path span { padding: 5px 7px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); background: var(--surface-selected); color: var(--text-primary); font-size: 11px; }
.path b { color: var(--text-muted); font-weight: 400; }
.equation { padding: 10px 11px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface-map-raised); color: var(--map-community-earth); font: 12px/1.55 var(--font-mono); overflow-wrap: anywhere; }
.oral { padding: var(--space-3); border-inline-start: 2px solid var(--map-community-earth); background: var(--surface-muted); color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.55; }
.hint { margin-top: var(--space-4); color: var(--text-muted); font-size: 11px; }
.related-nodes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.related-node {
  min-height: var(--control-hit-size);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-control);
  color: var(--text-secondary);
  text-align: left;
  cursor: pointer;
}
.related-node:hover { color: var(--text-primary); background: var(--surface-control-hover); }

.map-key {
  position: absolute;
  left: 50%;
  bottom: max(var(--space-4), env(safe-area-inset-bottom));
  display: flex;
  gap: var(--space-4);
  align-items: center;
  transform: translateX(-50%);
  padding: 9px var(--space-3);
  border-radius: var(--radius-pill);
  color: var(--text-muted);
  font-size: 10px;
  white-space: nowrap;
}
.map-key > span { display: inline-flex; gap: 7px; align-items: center; }
.glyph-key { display: inline-block; width: 9px; height: 9px; border: 1.5px solid currentColor; color: var(--text-secondary); }
.glyph-foundation { border-radius: 50%; box-shadow: inset 0 0 0 2px var(--surface-floating); outline: 1px solid currentColor; outline-offset: 2px; }
.glyph-standard { border-radius: 50%; }
.glyph-personal { transform: rotate(45deg); border-radius: 1px; color: var(--map-community-personal); }
.glyph-modern { border-radius: 3px; color: var(--map-community-modern); }

@media (max-width: 980px) {
  .command-dock { width: min(620px, calc(100vw - 32px)); }
  .brand-mark { min-width: 48px; padding-inline: 3px; }
  .brand-copy { display: none; }
  .inspector { top: auto; bottom: max(var(--space-4), env(safe-area-inset-bottom)); max-height: 46svh; }
  .map-key { display: none; }
  .map-controls { bottom: calc(max(var(--space-4), env(safe-area-inset-bottom)) + 48svh); }
}

@media (max-width: 640px) {
  .command-dock {
    right: max(var(--space-3), env(safe-area-inset-right));
    left: max(var(--space-3), env(safe-area-inset-left));
    width: auto;
  }
  .brand-mark { display: none; }
  .layer-tabs {
    top: calc(max(var(--space-4), env(safe-area-inset-top)) + 66px);
    left: max(var(--space-3), env(safe-area-inset-left));
    max-width: calc(100vw - 24px);
  }
  .inspector {
    right: max(var(--space-3), env(safe-area-inset-right));
    left: max(var(--space-3), env(safe-area-inset-left));
    width: auto;
    padding: var(--space-4);
    border-radius: var(--radius-lg);
  }
  .map-controls { left: max(var(--space-3), env(safe-area-inset-left)); }
  .scale-readout { min-width: 96px; padding-inline: var(--space-2); }
}

@media (max-height: 560px) and (orientation: landscape) {
  .inspector { top: var(--space-3); bottom: var(--space-3); max-height: none; width: 320px; }
  .map-controls { bottom: max(var(--space-3), env(safe-area-inset-bottom)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

.inspector-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-2);
}
.inspector-head h1 { margin-bottom: 0; }
.inspector-close { flex: 0 0 var(--control-hit-size); }

</style>
</head>
<body>
  <main id="app" class="app-shell">
    <canvas
      id="map"
      tabindex="0"
      aria-label="세종과학고 과학 개념 Memory Palace 지도"
      aria-describedby="map-help map-status"
    ></canvas>

    <div class="map-atmosphere" aria-hidden="true"></div>

    <header class="command-dock" aria-label="지도 명령">
      <div class="brand-mark" aria-label="SJHS Science Memory Palace">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3.2"></circle>
            <circle cx="12" cy="12" r="8.2"></circle>
            <path d="M4.8 7.8 2.9 5.9M19.2 16.2l1.9 1.9"></path>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>SJHS PALACE</strong>
          <small>FIRST PRINCIPLES MAP</small>
        </span>
      </div>

      <div class="search-shell">
        <label class="sr-only" for="search">과학 개념 검색</label>
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4.2 4.2"></path>
          </svg>
        </span>
        <input
          id="search"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="개념 찾기  /"
        />
      </div>

      <div class="dock-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 전환" title="테마 전환">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M20.4 15.1A8.4 8.4 0 0 1 8.9 3.6 8.6 8.6 0 1 0 20.4 15.1Z"></path>
          </svg>
        </button>
        <button id="reset" class="icon-button" type="button" aria-label="전체 지도 보기" title="전체 지도 보기">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="7.5"></circle>
            <path d="M12 8v4l2.8 1.8M4.5 5.5v4h4"></path>
          </svg>
        </button>
      </div>
    </header>

    <nav id="filters" class="layer-tabs" aria-label="지식 레이어">
      <button type="button" data-filter="all" class="active" aria-pressed="true">전체</button>
      <button type="button" data-filter="curriculum" aria-pressed="false">중등 필수</button>
      <button type="button" data-filter="personal" aria-pressed="false">내 탐구</button>
      <button type="button" data-filter="modern" aria-pressed="false">현대물리</button>

const LEVEL_THRESHOLDS = [0.5,0.8,1.4,2.2,3.3,4.6];

function buildIndexes(graph) {
  const nodesById = new Map(graph.nodes.map(node => [node.id,node]));
  const adjacency = new Map(graph.nodes.map(node => [node.id, []]));
  for (const edge of graph.edges) {
    if (adjacency.has(edge.source)) adjacency.get(edge.source).push(edge.target);
    if (adjacency.has(edge.target)) adjacency.get(edge.target).push(edge.source);
  }
  return {nodesById,adjacency};
}

const SEMANTIC_PARENT_RELATIONS = [
  'EXPLAINS','CAUSES','REQUIRES','DERIVED_FROM',
  'REGULATES','CONVERTS_TO','MEASURED_BY','APPLIES_TO',
];

function buildSemanticHierarchy(graph) {
  const nodeById = new Map(graph.nodes.map(node => [node.id, node]));
  const incoming = new Map(graph.nodes.map(node => [node.id, []]));
  for (const edge of graph.edges) {
    if (incoming.has(edge.target)) incoming.get(edge.target).push(edge);
  }

  const parentById = new Map(graph.nodes.map(node => [node.id, null]));
  const priority = new Map(SEMANTIC_PARENT_RELATIONS.map((type, index) => [type, index]));

  for (const node of graph.nodes) {
    const candidates = (incoming.get(node.id) ?? [])
      .map(edge => ({ edge, source: nodeById.get(edge.source) }))
      .filter(({ source }) => source && source.level < node.level);

    const sortCandidates = (a,b) =>
      (node.level-a.source.level)-(node.level-b.source.level) ||
      (b.edge.strength??0)-(a.edge.strength??0) ||
      a.source.id.localeCompare(b.source.id);

    const partOf = candidates
      .filter(({ edge }) => edge.type === 'PART_OF')
      .sort(sortCandidates);

    const fallback = candidates
      .filter(({ edge }) => priority.has(edge.type))
      .sort((a,b) => priority.get(a.edge.type)-priority.get(b.edge.type) || sortCandidates(a,b));

    const chosen = partOf[0] ?? fallback[0];
    if (chosen) parentById.set(node.id, chosen.source.id);
  }

  const childrenById = new Map(graph.nodes.map(node => [node.id, []]));
  for (const [childId, parentId] of parentById) {
    if (parentId) childrenById.get(parentId)?.push(childId);
  }
  for (const children of childrenById.values()) children.sort();

  const descendantsById = new Map();
  for (const node of graph.nodes) {
    const descendants = new Set();
    const stack = [...(childrenById.get(node.id) ?? [])];
    while (stack.length) {
      const childId = stack.pop();
      if (descendants.has(childId)) continue;
      descendants.add(childId);
      stack.push(...(childrenById.get(childId) ?? []));
    }
    descendantsById.set(node.id, descendants);
  }

  return { parentById, childrenById, descendantsById };
}

function semanticChildren(hierarchy, nodeId) {
  return hierarchy.childrenById.get(nodeId) ?? [];
}

function validateGraph(graph) {
  const nodeIds = new Set();
  const duplicateNodeIds = [];
  for (const node of graph.nodes) {
    if (nodeIds.has(node.id)) duplicateNodeIds.push(node.id);
    nodeIds.add(node.id);
  }
  const danglingEdges = graph.edges.filter(edge => !nodeIds.has(edge.source) || !nodeIds.has(edge.target));
  const mapped = new Set(graph.nodes.flatMap(node => node.curriculumRefs ?? []));
  const missingCurriculumUnits = graph.curriculumUnits.filter(unit => !mapped.has(unit.id)).map(unit => unit.id);
  return {duplicateNodeIds,danglingEdges,missingCurriculumUnits};
}

function zoomThresholdForLevel(level) {
  return LEVEL_THRESHOLDS[Math.min(Math.max(level ?? 0,0),LEVEL_THRESHOLDS.length-1)];
}

function getVisibleNodes(graph, zoom, filters = {}) {
  const query=(filters.query ?? '').trim().toLowerCase();
  return graph.nodes.filter(node => {
    if (zoom < zoomThresholdForLevel(node.level)) return false;
    if (filters.community && filters.community !== 'all' && node.community !== filters.community) return false;
    if (filters.curriculum === true && !(node.curriculumRefs?.length)) return false;
    if (filters.personal === true && !(node.tags?.includes('personal'))) return false;
    if (filters.modern === true && !(node.tags?.includes('modern') || node.community === 'modern')) return false;
    if (query) {
      const haystack=[node.name,node.summary,...(node.tags??[])].join(' ').toLowerCase();
      if (!haystack.includes(query)) return false;
    }
    return true;
  });
}

function shortestPath(graph, fromId, toId) {
  if (fromId === toId) return [fromId];
  const {nodesById,adjacency}=buildIndexes(graph);
  if (!nodesById.has(fromId) || !nodesById.has(toId)) return [];
  const queue=[fromId];
  const prev=new Map([[fromId,null]]);
  for (let head=0; head<queue.length; head++) {
    const current=queue[head];
    for (const next of adjacency.get(current) ?? []) {
      if (prev.has(next)) continue;
      prev.set(next,current);
      if (next === toId) {
        const path=[];
        let cursor=toId;
        while (cursor !== null) { path.push(cursor); cursor=prev.get(cursor); }
        return path.reverse();
      }
      queue.push(next);
    }
  }
  return [];
}

const COMMUNITY_TOKEN = {
  foundations: '--map-community-foundation',
  physics: '--map-community-physics',
  chemistry: '--map-community-chemistry',
  life: '--map-community-biology',
  biology: '--map-community-biology',
  earth: '--map-community-earth',
  integration: '--map-community-foundation',
  modern: '--map-community-modern',
  personal: '--map-community-personal',
  math: '--map-community-math',
};

const LABEL_THRESHOLDS = [0.5, 1.15, 1.85, 2.75, 4.05, 5.15];

function worldToScreenPoint(point, state) {
  return { x: point.x * state.zoom + state.panX, y: point.y * state.zoom + state.panY };
}

function screenToWorldPoint(point, state) {
  return { x: (point.x - state.panX) / state.zoom, y: (point.y - state.panY) / state.zoom };
}

function nodeGlyph(node) {
  if (node.kind === 'landmark' || node.community === 'foundations') return 'ring';
  if (node.community === 'personal' || node.tags?.includes('personal')) return 'diamond';
  if (node.community === 'modern' || node.tags?.includes('modern')) return 'rounded-square';
  return 'circle';
}

function labelVisibility(node, zoom, selected = false) {
  if (selected) return true;
  if (node.kind === 'landmark' || (node.importance ?? 0) >= 5) return true;
  const level = Math.min(Math.max(node.level ?? 0, 0), LABEL_THRESHOLDS.length - 1);
  return zoom >= LABEL_THRESHOLDS[level];
}

function nodeRadius(node, zoom) {
  const base = 3 + (node.importance ?? 1) * 1.45;
  return Math.max(3.3, Math.min(base * Math.sqrt(Math.max(zoom, 0.7)), 22));
}

function roundedRect(ctx, x, y, width, height, radius) {
  const safeRadius = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + safeRadius, y);
  ctx.arcTo(x + width, y, x + width, y + height, safeRadius);
  ctx.arcTo(x + width, y + height, x, y + height, safeRadius);
  ctx.arcTo(x, y + height, x, y, safeRadius);
  ctx.arcTo(x, y, x + width, y, safeRadius);
  ctx.closePath();
}

function readPalette() {
  const styles = getComputedStyle(document.documentElement);
  const token = name => styles.getPropertyValue(name).trim();
  return {
    edge: token('--map-edge'),
    edgeRelated: token('--map-edge-related'),
    edgeDim: token('--map-edge-dim'),
    labelBg: token('--map-label-bg'),
    label: token('--map-label'),
    labelDim: token('--map-label-dim'),
    selection: token('--map-selection-ring'),
    landmarkCore: token('--map-landmark-core'),
    terrain: token('--map-terrain'),
    communities: Object.fromEntries(
      Object.entries(COMMUNITY_TOKEN).map(([community, tokenName]) => [community, token(tokenName)]),
    ),
  };
}

function buildShapePath(ctx, glyph, point, radius) {
  if (glyph === 'diamond') {
    ctx.beginPath();
    ctx.moveTo(point.x, point.y - radius);
    ctx.lineTo(point.x + radius, point.y);
    ctx.lineTo(point.x, point.y + radius);
    ctx.lineTo(point.x - radius, point.y);
    ctx.closePath();
    return;
  }

  if (glyph === 'rounded-square') {
    roundedRect(ctx, point.x - radius, point.y - radius, radius * 2, radius * 2, Math.max(2, radius * 0.35));
    return;
  }

  ctx.beginPath();
  ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
  ctx.closePath();
}

function drawCommunityContours(ctx, nodes, state, palette) {
  if (state.zoom > 3.4) return;
  const groups = new Map();

  for (const node of nodes) {
    if ((node.level ?? 0) > 2) continue;
    const point = worldToScreenPoint(node, state);
    const group = groups.get(node.community) ?? [];
    group.push(point);
    groups.set(node.community, group);
  }

  ctx.save();
  ctx.setLineDash([2, 9]);
  ctx.lineWidth = 0.9;

  for (const [community, points] of groups) {
    if (points.length < 2) continue;
    const centerX = points.reduce((sum, point) => sum + point.x, 0) / points.length;
    const centerY = points.reduce((sum, point) => sum + point.y, 0) / points.length;
    const spreadX = Math.max(64, ...points.map(point => Math.abs(point.x - centerX) + 44));
    const spreadY = Math.max(52, ...points.map(point => Math.abs(point.y - centerY) + 38));
    ctx.globalAlpha = Math.max(0.045, 0.095 - state.zoom * 0.012);
    ctx.strokeStyle = palette.communities[community] || palette.labelDim;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY, spreadX, spreadY, -0.08, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawNode(ctx, node, point, radius, color, state, palette) {
  const selected = node.id === state.selectedId;
  const neighbors = state.selectedNeighborIds ?? new Set();
  const dimmed = state.selectedId && !selected && !neighbors.has(node.id);
  const glyph = nodeGlyph(node);

  ctx.save();
  ctx.globalAlpha = dimmed ? 0.22 : 1;

  if ((node.importance ?? 1) >= 4 || selected) {
    ctx.shadowBlur = selected ? 24 : 11;
    ctx.shadowColor = color;
  }

  if (glyph === 'ring') {
    ctx.shadowBlur = 0;
    ctx.strokeStyle = color;
    ctx.lineWidth = selected ? 2.4 : 1.6;
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = palette.landmarkCore;
    ctx.beginPath();
    ctx.arc(point.x, point.y, Math.max(2.2, radius * 0.34), 0, Math.PI * 2);
    ctx.fill();
  } else {
    buildShapePath(ctx, glyph, point, radius);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = palette.labelDim;
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  if (selected) {
    ctx.shadowBlur = 0;
    ctx.strokeStyle = palette.selection;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius + 4.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (labelVisibility(node, state.zoom, selected)) {
    const importance = node.importance ?? 1;
    const fontSize = Math.max(10.5, Math.min(16, importance >= 4 ? 12.2 + state.zoom * 0.42 : 10.4 + state.zoom * 0.28));
    const weight = importance >= 4 ? 650 : 520;
    ctx.font = `${weight} ${fontSize}px ui-sans-serif, system-ui, -apple-system, "Noto Sans KR", sans-serif`;
    const text = node.name;
    const textWidth = ctx.measureText(text).width;
    const x = point.x + radius + 8;
    const y = point.y + 4;

    if (importance >= 4 || selected) {
      roundedRect(ctx, x - 4, y - fontSize, textWidth + 8, fontSize + 7, 5);
      ctx.fillStyle = palette.labelBg;
      ctx.fill();
    }

    ctx.fillStyle = selected ? palette.label : dimmed ? palette.labelDim : palette.label;
    ctx.fillText(text, x, y);
  }

  ctx.restore();
}

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.floor(rect.width * dpr));
    const height = Math.max(1, Math.floor(rect.height * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return rect;
  }

  function render(state) {
    const rect = resize();
    const palette = readPalette();
    ctx.clearRect(0, 0, rect.width, rect.height);

    const nodes = state.visibleNodes;
    const visibleIds = new Set(nodes.map(node => node.id));
    const selected = state.selectedId;
    const selectedNeighbors = state.selectedNeighborIds ?? new Set();

    const center = worldToScreenPoint({ x: 0, y: 0 }, state);
    const gradient = ctx.createRadialGradient(
      center.x,
      center.y,
      16,
      center.x,
      center.y,
      Math.min(rect.width, rect.height) * 0.56,
    );
    gradient.addColorStop(0, palette.terrain);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, rect.width, rect.height);

    drawCommunityContours(ctx, nodes, state, palette);

    for (const edge of state.graph.edges) {
      if (!visibleIds.has(edge.source) || !visibleIds.has(edge.target)) continue;
      const source = state.nodesById.get(edge.source);
      const target = state.nodesById.get(edge.target);
      const sourcePoint = worldToScreenPoint(source, state);
      const targetPoint = worldToScreenPoint(target, state);
      const related = !selected
        || edge.source === selected
        || edge.target === selected
        || (selectedNeighbors.has(edge.source) && selectedNeighbors.has(edge.target));

      ctx.strokeStyle = !selected ? palette.edge : related ? palette.edgeRelated : palette.edgeDim;
      ctx.lineWidth = related
        ? Math.min(2.2, 0.42 + (edge.strength ?? 1) * 0.17)
        : 0.45;
      ctx.beginPath();
      ctx.moveTo(sourcePoint.x, sourcePoint.y);
      ctx.lineTo(targetPoint.x, targetPoint.y);
      ctx.stroke();
    }

    for (const node of nodes) {
      const point = worldToScreenPoint(node, state);
      if (point.x < -80 || point.y < -80 || point.x > rect.width + 80 || point.y > rect.height + 80) continue;
      const radius = nodeRadius(node, state.zoom);
      const color = palette.communities[node.community] || palette.label;
      drawNode(ctx, node, point, radius, color, state, palette);
    }
  }

  function hitTest(screenX, screenY, state, nodes = state.visibleNodes) {
    let best = null;
    let bestDistance = Number.POSITIVE_INFINITY;
    for (const node of nodes) {
      const point = worldToScreenPoint(node, state);
      const distance = Math.hypot(screenX - point.x, screenY - point.y);
      const threshold = Math.max(11, nodeRadius(node, state.zoom) + 8);
      if (distance <= threshold && distance < bestDistance) {
        best = node;
        bestDistance = distance;
      }
    }
    return best;
  }

  return {
    render,
    hitTest,
    screenToWorld: (x, y, state) => screenToWorldPoint({ x, y }, state),
  };
}

const DIRECTION_VECTORS = {
  right: { x: 1, y: 0 },
  left: { x: -1, y: 0 },
  up: { x: 0, y: -1 },
  down: { x: 0, y: 1 },
};

function directionalNeighbor(nodes, selectedId, direction) {
  const origin = nodes.find(node => node.id === selectedId);
  const vector = DIRECTION_VECTORS[direction];
  if (!origin || !vector) return null;

  let best = null;
  let bestScore = Number.POSITIVE_INFINITY;

  for (const node of nodes) {
    if (node.id === selectedId) continue;
    const dx = node.x - origin.x;
    const dy = node.y - origin.y;
    const forward = dx * vector.x + dy * vector.y;
    if (forward <= 0) continue;

    const lateral = Math.abs(dx * vector.y - dy * vector.x);
    const distance = Math.hypot(dx, dy);
    const score = distance + lateral * 0.8;
    if (score < bestScore) {
      best = node;
      bestScore = score;
    }
  }

  return best;
}

function resolveThemePreference(explicitPreference, systemDark) {
  if (explicitPreference === 'light' || explicitPreference === 'dark') {
    return explicitPreference;
  }
  return systemDark ? 'dark' : 'light';
}

function zoomBand(zoom) {
  if (zoom < 1.2) return 'WORLD';
  if (zoom < 2.0) return 'CONTINENT';
  if (zoom < 3.1) return 'REGION';
  if (zoom < 4.5) return 'CITY';
  return 'STREET';
}

function nextZoom(current, delta) {
  return Math.min(6, Math.max(0.5, current * Math.exp(delta * 0.14)));
}

const FOUNDATION_IDS = ['matter', 'energy', 'interaction', 'information', 'equilibrium', 'space-time'];
const THEME_STORAGE_KEY = 'sjhs-memory-palace-theme';

function preferredFoundationPath(nodeId) {
  let best = [];
  for (const target of FOUNDATION_IDS) {
    const path = shortestPath(graph, nodeId, target);
    if (path.length && (!best.length || path.length < best.length)) best = path;
  }
  return best;
}

function themeIcon(theme) {
  if (theme === 'dark') {
    return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"></path></svg>';
  }
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M20.4 15.1A8.4 8.4 0 0 1 8.9 3.6 8.6 8.6 0 1 0 20.4 15.1Z"></path></svg>';
}

function init() {
  const canvas = document.getElementById('map');
  const details = document.getElementById('details');
  const search = document.getElementById('search');
  const reset = document.getElementById('reset');
  const themeToggle = document.getElementById('theme-toggle');
  const zoomIn = document.getElementById('zoom-in');
  const zoomOut = document.getElementById('zoom-out');
  const filters = document.getElementById('filters');
  const zoomValue = document.getElementById('zoom-value');
  const zoomLabel = document.getElementById('zoom-label');
  const mapStatus = document.getElementById('map-status');
  const renderer = createRenderer(canvas);
  const { nodesById, adjacency } = buildIndexes(graph);
  const curriculumById = new Map(graph.curriculumUnits.map(unit => [unit.id, unit]));

  const state = {
    graph,
    nodesById,
    zoom: 0.8,
    panX: window.innerWidth / 2,
    panY: window.innerHeight / 2,
    selectedId: null,
    selectedNeighborIds: new Set(),
    activeFilter: 'all',
    visibleNodes: [],
  };

  let dragging = false;
  let startX = 0;
  let startY = 0;
  let startPanX = 0;
  let startPanY = 0;
  let moved = 0;
  let dirty = true;
  let statusTimer = null;

  details.tabIndex = -1;

  const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)');
  let explicitTheme = null;
  try {
    const stored = window.localStorage?.getItem(THEME_STORAGE_KEY);
    if (stored === 'light' || stored === 'dark') explicitTheme = stored;
  } catch {
    explicitTheme = null;
  }

  function currentTheme() {
    return resolveThemePreference(explicitTheme, systemTheme?.matches ?? true);
  }

  function applyTheme() {
    const theme = currentTheme();
    document.documentElement.dataset.theme = theme;
    themeToggle.innerHTML = themeIcon(theme);
    themeToggle.setAttribute('aria-label', theme === 'dark' ? '밝은 테마로 전환' : '어두운 테마로 전환');
    themeToggle.title = themeToggle.getAttribute('aria-label');
    dirty = true;
  }

  function persistTheme(theme) {
    explicitTheme = theme;
    try {
      window.localStorage?.setItem(THEME_STORAGE_KEY, theme);
    } catch {
      // file:// previews may deny storage; the session theme still works.
    }
    applyTheme();
  }

  function filtersForState() {
    if (state.activeFilter === 'curriculum') return { curriculum: true };
    if (state.activeFilter === 'personal') return { personal: true };
    if (state.activeFilter === 'modern') return { modern: true };
    return {};
  }

  function statusText() {
    const selected = state.selectedId ? nodesById.get(state.selectedId) : null;
    const selectedText = selected ? ` 선택: ${selected.name}.` : '';
    return `${zoomBand(state.zoom)}. 확대 ${state.zoom.toFixed(2)}배. ${state.visibleNodes.length}개 개념 표시.${selectedText}`;
  }

  function announceStatus({ delayed = false } = {}) {
    window.clearTimeout(statusTimer);
    if (!delayed) {
      mapStatus.textContent = statusText();
      return;
    }
    statusTimer = window.setTimeout(() => {
      mapStatus.textContent = statusText();
    }, 180);
  }

  function refreshVisible({ announce = false } = {}) {
    state.visibleNodes = getVisibleNodes(graph, state.zoom, filtersForState());
    dirty = true;
    if (announce) announceStatus();
  }

  function renderIdleDetails() {
    details.innerHTML = `
      <div class="inspector-idle">
        <div class="eyebrow">MEMORY PALACE</div>
        <h1>지식 세계지도</h1>
        <p>확대할수록 원리의 아래층이 열린다.</p>
        <div class="shortcut-row" aria-label="지도 조작 도움말">
          <span><kbd>+</kbd><kbd>−</kbd> 확대</span>
          <span><kbd>방향키</kbd> 이동</span>
          <span><kbd>/</kbd> 검색</span>
        </div>
      </div>`;
  }

  function clearSelection({ renderIdle = true } = {}) {
    state.selectedId = null;
    state.selectedNeighborIds = new Set();
    if (renderIdle) renderIdleDetails();
    dirty = true;
    announceStatus();
  }

  function setSelected(id) {
    const node = nodesById.get(id);
    if (!node) return;
    state.selectedId = id;
    state.selectedNeighborIds = new Set(adjacency.get(id) ?? []);
    renderDetails(id);
    dirty = true;
    announceStatus();
  }

  function focusNode(node) {
    if (!node) return;
    const needed = zoomThresholdForLevel(node.level) + 0.28;
    state.zoom = Math.max(state.zoom, Math.min(5.25, needed));
    const targetX = window.innerWidth * (window.innerWidth > 980 ? 0.42 : 0.5);
    const targetY = window.innerHeight * (window.innerWidth > 980 ? 0.50 : 0.42);
    state.panX = targetX - node.x * state.zoom;
    state.panY = targetY - node.y * state.zoom;
    refreshVisible();
    setSelected(node.id);
  }

  function findByQuery(rawQuery) {
    const query = rawQuery.trim().toLowerCase();
    if (!query) return null;
    const scored = graph.nodes
      .map(node => {
        const name = node.name.toLowerCase();
        let score = name === query ? 100 : name.startsWith(query) ? 70 : name.includes(query) ? 50 : 0;
        if (!score && (node.tags ?? []).some(tag => String(tag).toLowerCase().includes(query))) score = 20;
        if (!score && node.summary?.toLowerCase().includes(query)) score = 10;
        return { node, score };
      })
      .filter(value => value.score)
      .sort((a, b) => b.score - a.score || (b.node.importance ?? 0) - (a.node.importance ?? 0));
    return scored[0]?.node ?? null;
  }

  function nodeLinks(node) {
    return (adjacency.get(node.id) ?? [])
      .map(id => nodesById.get(id))
      .filter(Boolean)
      .sort((a, b) => (b.importance ?? 0) - (a.importance ?? 0))
      .slice(0, 8);
  }

  function renderDetails(id) {
    const node = nodesById.get(id);
    if (!node) return;
    const path = preferredFoundationPath(id).map(pathId => nodesById.get(pathId)?.name).filter(Boolean);
    const units = (node.curriculumRefs ?? []).map(ref => curriculumById.get(ref)?.name).filter(Boolean);
    const links = nodeLinks(node);
    const chips = [...new Set([node.community, ...units, ...(node.personalRefs ?? [])])].filter(Boolean);
    const mechanism = node.mechanism ?? [];
    details.innerHTML = `
      <div class="inspector-head">
        <div>
          <div class="eyebrow">${node.kind === 'landmark' ? 'LANDMARK' : node.tags?.includes('personal') ? 'PERSONAL DEEP ZONE' : 'KNOWLEDGE NODE'}</div>
          <h1>${node.name}</h1>
        </div>
        <button class="icon-button inspector-close" type="button" data-action="clear-selection" aria-label="개념 상세 닫기" title="개념 상세 닫기">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17"></path></svg>
        </button>
      </div>
      <p>${node.summary || ''}</p>
      <div class="meta">${chips.map(chip => `<span class="chip">${chip}</span>`).join('')}</div>
      ${path.length > 1 ? `<h2>원초 원리로 내려가기</h2><div class="path">${path.map((part, index) => `${index ? '<b>←</b>' : ''}<span>${part}</span>`).join('')}</div>` : ''}
      ${mechanism.length ? `<h2>메커니즘</h2><div class="mechanism">${mechanism.map((part, index) => `<div class="step"><b>${String(index + 1).padStart(2, '0')}</b>&nbsp; ${part}</div>`).join('')}</div>` : ''}
      ${node.equation ? `<h2>관계식</h2><div class="equation">${node.equation}</div>` : ''}
      ${links.length ? `<h2>직접 연결</h2><div class="related-nodes">${links.map(link => `<button type="button" data-node="${link.id}" class="related-node">${link.name}</button>`).join('')}</div>` : ''}
      ${node.oralPrompt ? `<h2>출석면담</h2><div class="oral">${node.oralPrompt}</div>` : ''}
    `;
  }

  function resetFilterButtons(activeFilter) {
    [...filters.querySelectorAll('button[data-filter]')].forEach(button => {
      const isActive = button.dataset.filter === activeFilter;
      button.classList.toggle('active', isActive);
      button.setAttribute('aria-pressed', String(isActive));
    });
  }

  function resetView() {
    state.zoom = 0.8;
    state.panX = window.innerWidth / 2;
    state.panY = window.innerHeight / 2;
    state.activeFilter = 'all';
    search.value = '';
    resetFilterButtons('all');
    refreshVisible();
    clearSelection();
    canvas.focus({ preventScroll: true });
  }

  function zoomAt(screenX, screenY, delta, { announce = true } = {}) {
    const world = renderer.screenToWorld(screenX, screenY, state);
    const zoom = nextZoom(state.zoom, delta);
    state.zoom = zoom;
    state.panX = screenX - world.x * zoom;
    state.panY = screenY - world.y * zoom;
    refreshVisible();
    if (announce) announceStatus();
  }

  function zoomAtCenter(delta) {
    const rect = canvas.getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, delta);
  }

  function nearestVisibleToViewportCenter() {
    if (!state.visibleNodes.length) return null;
    const rect = canvas.getBoundingClientRect();
    const center = renderer.screenToWorld(rect.width / 2, rect.height / 2, state);
    return state.visibleNodes.reduce((best, node) => {
      const distance = Math.hypot(node.x - center.x, node.y - center.y);
      return !best || distance < best.distance ? { node, distance } : best;
    }, null)?.node ?? null;
  }

  function keyboardMove(direction) {
    const current = state.selectedId ? nodesById.get(state.selectedId) : nearestVisibleToViewportCenter();
    if (!current) return;
    if (!state.selectedId) {
      setSelected(current.id);
      return;
    }
    const next = directionalNeighbor(state.visibleNodes, current.id, direction);
    if (next) focusNode(next);
  }

  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    zoomAt(x, y, -event.deltaY * 0.008, { announce: false });
    announceStatus({ delayed: true });
  }, { passive: false });

  canvas.addEventListener('pointerdown', event => {
    dragging = true;
    moved = 0;
    startX = event.clientX;
    startY = event.clientY;
    startPanX = state.panX;
    startPanY = state.panY;
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add('dragging');
  });

  canvas.addEventListener('pointermove', event => {
    if (!dragging) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    moved = Math.max(moved, Math.hypot(dx, dy));
    state.panX = startPanX + dx;
    state.panY = startPanY + dy;
    dirty = true;
  });

  canvas.addEventListener('pointerup', event => {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    if (moved < 6) {
      const rect = canvas.getBoundingClientRect();
      const hit = renderer.hitTest(event.clientX - rect.left, event.clientY - rect.top, state);
      if (hit) setSelected(hit.id);
      else clearSelection();
    }
  });

  canvas.addEventListener('keydown', event => {
    const directions = {
      ArrowRight: 'right',
      ArrowLeft: 'left',
      ArrowUp: 'up',
      ArrowDown: 'down',
    };
    if (directions[event.key]) {
      event.preventDefault();
      keyboardMove(directions[event.key]);
      return;
    }
    if (event.key === '+' || event.key === '=') {
      event.preventDefault();
      zoomAtCenter(1);
      return;
    }
    if (event.key === '-' || event.key === '_') {
      event.preventDefault();
      zoomAtCenter(-1);
      return;
    }
    if (event.key === '0') {
      event.preventDefault();
      resetView();
      return;
    }
    if (event.key === 'Escape') {
      event.preventDefault();
      clearSelection();
      return;
    }
    if (event.key === 'Enter' && state.selectedId) {
      event.preventDefault();
      details.focus({ preventScroll: false });
    }
  });

  search.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      const node = findByQuery(search.value);
      if (node) focusNode(node);
      else mapStatus.textContent = `검색 결과 없음: ${search.value.trim()}`;
    }
    if (event.key === 'Escape') {
      search.value = '';
      canvas.focus({ preventScroll: true });
    }
  });

  details.addEventListener('click', event => {
    const nodeButton = event.target.closest('button[data-node]');
    if (nodeButton) {
      focusNode(nodesById.get(nodeButton.dataset.node));
      return;
    }
    if (event.target.closest('[data-action="clear-selection"]')) {
      clearSelection();
      canvas.focus({ preventScroll: true });
    }
  });

  zoomIn.addEventListener('click', () => zoomAtCenter(1));
  zoomOut.addEventListener('click', () => zoomAtCenter(-1));
  reset.addEventListener('click', resetView);
  themeToggle.addEventListener('click', () => persistTheme(currentTheme() === 'dark' ? 'light' : 'dark'));

  filters.addEventListener('click', event => {
    const button = event.target.closest('button[data-filter]');
    if (!button) return;
    state.activeFilter = button.dataset.filter;
    resetFilterButtons(state.activeFilter);
    refreshVisible();
    clearSelection();
  });

  window.addEventListener('keydown', event => {
    const target = event.target;
    const isTyping = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target?.isContentEditable;
    if (event.key === '/' && !isTyping) {
      event.preventDefault();
      search.focus({ preventScroll: true });
      search.select();
    }
  });

  window.addEventListener('resize', () => {
    dirty = true;
  });

  systemTheme?.addEventListener?.('change', () => {
    if (!explicitTheme) applyTheme();
  });

  function frame() {
    if (dirty) {
      renderer.render(state);
      zoomValue.textContent = `${state.zoom.toFixed(2)}×`;
      zoomLabel.textContent = zoomBand(state.zoom);
      dirty = false;
    }
    requestAnimationFrame(frame);
  }

  applyTheme();
  resetFilterButtons('all');
  refreshVisible();
  announceStatus();
  frame();
}

if (typeof document !== 'undefined') init();
</script>
</body>
</html>
