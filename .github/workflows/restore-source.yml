name: Restore canonical source

on:
  push:
    branches:
      - work/restore-source-structure

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/restore-source-structure
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recover verified source
        run: node scripts/recover-source.mjs
      - name: Commit recovered source if absent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SJHS_Memory_Palace_UIUX.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore verified canonical source"
            git push origin HEAD:work/restore-source-structure
          fi
