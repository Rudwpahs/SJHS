name: Apply recursive zoom task 3

on:
  push:
    branches:
      - feat/recursive-semantic-zoom

permissions:
  contents: write

jobs:
  apply-task3:
    if: "!contains(github.event.head_commit.message, 'feat: add recursive semantic zoom navigation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recursive-semantic-zoom
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply task 3 transform
        run: node scripts/apply-recursive-semantic-zoom-task3.mjs
      - name: Verify full feature
        run: npm run verify
      - name: Commit task 3 and remove one-shot tooling
        run: |
          rm scripts/apply-recursive-semantic-zoom-task3.mjs
          rm .github/workflows/apply-recursive-semantic-zoom-task3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SJHS_Memory_Palace_UIUX.html tests/helpers.mjs tests/source.test.mjs scripts/lib.mjs scripts/apply-recursive-semantic-zoom-task3.mjs .github/workflows/apply-recursive-semantic-zoom-task3.yml
          git commit -m "feat: add recursive semantic zoom navigation"
          git push origin HEAD:feat/recursive-semantic-zoom
