name: Apply recursive zoom review fix

on:
  push:
    branches:
      - feat/recursive-semantic-zoom

permissions:
  contents: write

jobs:
  review-fix:
    if: "!contains(github.event.head_commit.message, 'fix: use relative semantic depth for focused navigation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recursive-semantic-zoom
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply review fix
        run: node scripts/apply-recursive-semantic-zoom-review-fix.mjs
      - name: Verify review fix
        run: npm run verify
      - name: Commit review fix and remove one-shot tooling
        run: |
          rm scripts/apply-recursive-semantic-zoom-review-fix.mjs
          rm .github/workflows/apply-recursive-semantic-zoom-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SJHS_Memory_Palace_UIUX.html tests/helpers.mjs tests/source.test.mjs scripts/lib.mjs README.md docs/superpowers/plans/2026-09-11-recursive-semantic-zoom-status.md scripts/apply-recursive-semantic-zoom-review-fix.mjs .github/workflows/apply-recursive-semantic-zoom-review-fix.yml
          git commit -m "fix: use relative semantic depth for focused navigation"
          git push origin HEAD:feat/recursive-semantic-zoom
