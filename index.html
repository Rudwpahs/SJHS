<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="hsl(225 34% 4%)">
  <title>SJHS Science Memory Palace</title>
  <style>html,body{margin:0;min-height:100%;background:#080b12;color:#f5f7fb;font:16px/1.5 system-ui,sans-serif}body{display:grid;place-items:center}.boot{opacity:.72}</style>
</head>
<body>
  <p class="boot" role="status">Loading SJHS Memory Palace…</p>
  <script>window.__SJHS_PAYLOAD='';</script>
  <script src="./sjhs-payload-1.js"></script>
  <script src="./sjhs-payload-2.js"></script>
  <script src="./sjhs-payload-3.js"></script>
  <script src="./sjhs-payload-4.js"></script>
  <script>
  (async()=>{
    const bytes=Uint8Array.from(atob(window.__SJHS_PAYLOAD),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const text=await new Response(stream).text();
    document.open(); document.write(text); document.close();
  })().catch(error=>{
    document.body.innerHTML='<pre style="padding:24px;white-space:pre-wrap">Failed to load SJHS Memory Palace: '+String(error)+'</pre>';
  });
  </script>
</body>
</html>
